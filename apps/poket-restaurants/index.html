<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Poket Restaurants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=https://porest.poksol.com/">
  <script>
    // Vide l'ancien cache de l'application avant de rediriger (l'ancien service worker le servait en priorite).
    try { navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (_) {}
    try { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (_) {}
    location.replace("https://porest.poksol.com/" + location.hash);
  </script>
</head>
<body>
  <p>Poket Restaurants a changé d'adresse : <a href="https://porest.poksol.com/">porest.poksol.com</a></p>
</body>
</html>
